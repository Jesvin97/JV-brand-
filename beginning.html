<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Welcome - Joyal Vincent</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Lexend:wght@300;400&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#151311",
                        "primary": "#ffeec7",
                        "surface-tint": "#e9c24d",
                        "on-surface": "#e8e1de",
                        "on-surface-variant": "#d0c5b0",
                        "background": "#151311"
                    },
                    "fontFamily": {
                        "body-md": ["Lexend"],
                        "label-caps": ["DM Sans"],
                        "headline-md": ["DM Sans"]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #e8e1de; }
        .glass-panel { background: rgba(26, 25, 24, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(242, 241, 229, 0.05); }
        .gold-rim { border-top: 1px solid rgba(255, 238, 199, 0.2); }
        .btn-primary { background-color: #0A0A0A; color: #e8e1de; border: 1px solid #ffeec7; transition: all 0.3s ease; }
        .btn-primary:hover { box-shadow: inset 0 0 0 2px #ffeec7; background-color: rgba(255, 238, 199, 0.05); }
        .input-underline { background: transparent; border: none; border-bottom: 1px solid #99907c; transition: border-color 0.3s ease; width: 100%; padding: 0.5rem 0; color: #e8e1de; }
        .input-underline:focus { outline: none; border-bottom: 2px solid #ffeec7; }
        .float-container { position: relative; padding-top: 1.5rem; }
        .float-label { position: absolute; top: 2rem; left: 0; color: #99907c; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; transition: all 0.3s ease; pointer-events: none; }
        .input-underline:focus~.float-label, .input-underline:not(:placeholder-shown)~.float-label { top: 0; font-size: 10px; color: #ffeec7; }
    </style>
</head>

<body class="antialiased min-h-screen flex items-center justify-center relative overflow-x-hidden p-margin-mobile">
    <section class="w-full max-w-md" id="phase-1">
        <div class="glass-panel p-10 md:p-12 rounded-xl text-center gold-rim relative overflow-hidden">
            <h2 class="font-headline-md text-headline-md text-on-surface mb-2">Welcome</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mb-8">Please enter your details to view the website.</p>
            
            <form class="flex flex-col gap-6 text-left" id="lead-form">
                <div class="float-container">
                    <input class="input-underline !bg-white !text-black px-2 rounded-sm" id="fullname" placeholder=" " required type="text" />
                    <label class="float-label" for="fullname">Full Name</label>
                </div>
                <div class="float-container">
                    <input class="input-underline !bg-white !text-black px-2 rounded-sm" id="mobile" pattern="[6-9][0-9]{9}" placeholder=" " required title="Valid 10-digit mobile number" type="tel" />
                    <label class="float-label" for="mobile">Mobile Number</label>
                </div>
                <button class="btn-primary mt-4 py-4 px-8 font-label-caps text-label-caps tracking-widest uppercase rounded flex items-center justify-center gap-2 group" type="submit">
                    <span>Continue</span>
                    <span class="material-symbols-outlined transition-transform group-hover:translate-x-1" style="font-size: 16px;">arrow_forward</span>
                </button>
            </form>

            <div class="absolute inset-0 bg-surface/90 backdrop-blur-sm flex flex-col items-center justify-center hidden" id="loading-state">
                <span class="material-symbols-outlined animate-spin text-primary mb-4" style="font-size: 32px;">progress_activity</span>
                <p class="font-label-caps text-label-caps text-primary tracking-widest">Validating...</p>
            </div>
        </div>
    </section>

    <script>
        const form = document.getElementById('lead-form');
        const loading = document.getElementById('loading-state');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const details = {
                name: document.getElementById('fullname').value,
                mobile: document.getElementById('mobile').value,
                timestamp: new Date().toISOString()
            };

            // Show loading state
            loading.classList.remove('hidden');

            try {
                // Send to backend
                const response = await fetch('http://localhost:3000/api/leads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(details)
                });

                if (response.ok) {
                    // Save to localStorage
                    localStorage.setItem('jv_brand_lead', JSON.stringify(details));
                    
                    // Redirect after a short delay
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                } else {
                    console.error('Failed to save lead');
                    alert('Something went wrong. Please try again.');
                    loading.classList.add('hidden');
                }
            } catch (err) {
                console.error('Error connecting to server:', err);
                // Fallback: still allow access if server is down (optional, but good for UX)
                localStorage.setItem('jv_brand_lead', JSON.stringify(details));
                window.location.href = 'index.html';
            }
        });

        // If already filled, redirect to index
        if (localStorage.getItem('jv_brand_lead')) {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
